<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects | Katherine Shin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="projects.css">
<link rel="preload" as="image" href="assets/subway-front.webp">
<link rel="preload" as="image" href="assets/subway-middle.webp">
<link rel="preload" as="image" href="assets/subway-back.webp">
<script>
  // Hide the new page until the train is drawn in front of it
  try { if (sessionStorage.getItem('train') && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('arriving'); } catch {}
</script>
</head>
<body>
<nav class="nav" aria-label="Main">
  <a data-page href="index.html">Home</a>
  <a data-page href="about.html">About Me</a>
  <a data-page href="contact.html">Contact</a>
  <a data-page href="projects.html" aria-current="page">Projects</a>
</nav>
<main class="station">
  <div class="poster">
    <header class="poster-title">
      <h1>Projects</h1>
      <p>Pick a stop to see a project.</p>
    </header>
    <svg class="line" aria-hidden="true">
      <defs><mask id="draw" maskUnits="userSpaceOnUse"><path pathLength="1" fill="none" stroke="#fff" stroke-width="60"/></mask></defs>
      <image mask="url(#draw)"/>
    </svg>
    <ol class="stops"></ol>
  </div>
  <div class="platform"></div>
</main>

<dialog class="sign" aria-labelledby="sign-title">
  <div class="sign-head">
    <span class="sign-stop"></span>
    <h2 id="sign-title"></h2>
    <button class="sign-close" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="sign-body">
    <div class="sign-pic"></div>
    <div class="sign-text">
      <p class="sign-about"></p>
      <p class="sign-tools"></p>
      <a class="sign-link" target="_blank" rel="noopener">See the project</a>
    </div>
  </div>
  <div class="sign-nav">
    <button class="btn" type="button" data-step="-1"><span>Prev stop</span></button>
    <button class="btn" type="button" data-step="1"><span>Next stop</span></button>
  </div>
</dialog>
<script src="projects.js"></script>
<script src="script.js"></script>
</body>
</html>
